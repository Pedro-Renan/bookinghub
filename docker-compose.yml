version: "3.9"

services:

  db:
    image: postgres:16
    container_name: bookinghub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       bookinghub
      POSTGRES_USER:     booking
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./wal_archive:/wal_archive          # arquivamento WAL para PITR
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d bookinghub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bookinghub-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://booking:secret@db:5432/bookinghub
      API_PORT:     "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app          # hot-reload em desenvolvimento

volumes:
  pgdata:
