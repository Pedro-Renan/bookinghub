# ============================================================
#  BookingHub — postgresql.conf
#  Configurações para ambiente de desenvolvimento/produção
# ============================================================

# --- Conexões ---
max_connections = 150
superuser_reserved_connections = 3

# --- Memória ---
shared_buffers            = 256MB     # aumentar para 25% da RAM em produção
work_mem                  = 32MB
maintenance_work_mem      = 64MB
effective_cache_size      = 768MB     # 75% da RAM disponível

# --- WAL e Durabilidade ---
wal_level                 = replica   # necessário para PITR e replicação
fsync                     = on
synchronous_commit        = off       # melhora throughput; risco mínimo em dev
wal_buffers               = 16MB
max_wal_size              = 1GB
min_wal_size              = 80MB

# --- Checkpoints ---
checkpoint_timeout          = 5min
checkpoint_completion_target = 0.9

# --- Arquivamento WAL (PITR) ---
archive_mode    = on
archive_command = 'test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
archive_timeout = 60

# --- Planner ---
random_page_cost      = 1.1    # SSD; reduzir favorece Index Scans
effective_io_concurrency = 200

# --- Logging ---
log_destination         = 'stderr'
logging_collector       = on
log_directory           = 'pg_log'
log_filename            = 'postgresql-%Y-%m-%d.log'
log_rotation_age        = 1d
log_rotation_size       = 100MB
log_min_duration_statement = 500    # loga queries > 500ms
log_checkpoints         = on
log_connections         = off
log_disconnections      = off
log_lock_waits          = on
log_temp_files          = 0
log_autovacuum_min_duration = 250ms

# --- Autovacuum (ajustado para tabelas com muitos UPDATEs) ---
autovacuum                     = on
autovacuum_vacuum_scale_factor  = 0.05   # vacuum com 5% de tuplas mortas
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay    = 2ms

# --- Localização ---
lc_messages  = 'en_US.UTF-8'
lc_monetary  = 'pt_BR.UTF-8'
lc_numeric   = 'pt_BR.UTF-8'
lc_time      = 'pt_BR.UTF-8'
datestyle    = 'iso, dmy'
timezone     = 'America/Fortaleza'
